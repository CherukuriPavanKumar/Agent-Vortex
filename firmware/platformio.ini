; =============================================================================
; Agent Vortex Handheld — PlatformIO Configuration
; Target: ESP32-S3-N16R8 (16 MB Flash, 8 MB PSRAM)
; Framework: ESP-IDF (native — no Arduino)
; Milestone: M1 — Boot diagnostics
; =============================================================================

[platformio]
default_envs = esp32s3_handheld

; =============================================================================
; Primary environment — ESP32-S3-N16R8 development board
; =============================================================================
[env:esp32s3_handheld]
platform  = espressif32@8.0.0
board     = esp32-s3-devkitc-1
framework = espidf

; ── Compilation ──────────────────────────────────────────────────────────────
; Use C17 for the firmware source; ESP-IDF headers require gnu extensions.
build_flags =
    -std=gnu17
    -Wall
    -Wextra
    -Wno-unused-parameter

; ── Flash ─────────────────────────────────────────────────────────────────────
; Override the board default (8 MB) to match the actual N16R8 module (16 MB).
board_upload.flash_size    = 16MB
board_upload.maximum_size  = 16777216
board_build.flash_size     = 16MB
board_build.flash_mode     = qio
board_build.flash_freq     = 80m

; ── Serial / upload ───────────────────────────────────────────────────────────
; upload_port is intentionally left unset so PlatformIO auto-detects the
; device. Set this explicitly once the board is connected and the port is
; confirmed with `pio device list`.
;
; upload_port = /dev/ttyACM0        ; uncomment and adjust after port confirmed
upload_speed  = 460800
monitor_speed = 115200

; ── PSRAM — deferred to Milestone 2 ──────────────────────────────────────────
; The N16R8 module has 8 MB OPI PSRAM (W83).
; Enable by adding to board_build.cmake_extra_args in a future milestone:
;   -DCONFIG_SPIRAM_MODE_OCT=y
;   -DCONFIG_ESP32S3_SPIRAM_SUPPORT=y
;   -DCONFIG_SPIRAM_SPEED_80M=y
; Do NOT enable it here — heap metrics in M1 diagnostics must reflect IRAM/DRAM
; without PSRAM confounding the baseline.

; ── Build type ────────────────────────────────────────────────────────────────
; Debug build: optimise for debugging, include assertions.
build_type = debug

